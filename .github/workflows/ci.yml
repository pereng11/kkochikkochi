name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      - name: Run tests
        run: bats tests/

      - name: Lint shell scripts
        run: |
          # shellcheck 가 러너 이미지에 우연히 들어 있는 것에 기대지 않는다.
          # 없어졌는데 lint 가 조용히 건너뛰어지면 그게 더 나쁘다.
          shellcheck --version
          shellcheck scripts/*.sh hooks/*.sh tests/helper.bash

      - name: Validate JSON
        run: |
          jq . hooks/hooks.json > /dev/null
          jq . .claude-plugin/plugin.json > /dev/null
          # 첫 설치가 유일하게 의존하는 파일이다. 빠뜨리면 안 된다.
          jq . .claude-plugin/marketplace.json > /dev/null
